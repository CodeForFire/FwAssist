name: Copilot approval

# Copilot code review (requested on every push by the "Copilot review for
# default branch" ruleset) only ever submits COMMENTED reviews; GitHub does not
# let it approve. This job turns a clean Copilot review into an approval:
#
# - Copilot left no inline comment on the PR's current head commit
#   -> github-actions[bot] approves.
# - Copilot left comments -> any earlier approval by github-actions[bot] is
#   dismissed, so a push Copilot now objects to does not keep an old green tick.
#
# Only PRs from a branch in this repository, opened by an owner, member,
# collaborator or Dependabot, are approved. A fork's PR never gets a bot
# approval. Needs "Allow GitHub Actions to create and approve pull requests"
# in the repository's Actions settings.

on:
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  group: copilot-approve-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  approve:
    name: approve clean Copilot review
    if: >-
      contains(fromJSON('["copilot-pull-request-reviewer[bot]","Copilot"]'), github.event.review.user.login) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
       github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # submit and dismiss the approval
    steps:
      - name: Approve or withdraw approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_SHA: ${{ github.event.review.commit_id }}
        run: |
          set -euo pipefail

          # Every path that does not approve withdraws an earlier bot approval.
          withdraw() {
            echo "$1; withdrawing any earlier bot approval."
            gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED") | .id' \
            | while read -r id; do
                gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$id/dismissals" \
                  -f message="$1." -f event=DISMISS --silent
              done
          }

          read -r head changed < <(gh api "repos/$REPO/pulls/$PR" --jq '"\(.head.sha) \(.changed_files)"')
          if [ "$REVIEW_SHA" != "$head" ]; then
            echo "Review is for $REVIEW_SHA, PR head is now $head; waiting for the review of the new push."
            exit 0
          fi

          comments=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews/$REVIEW_ID/comments" --jq '.[].id' | wc -l)
          if [ "$comments" -ne 0 ]; then
            withdraw "Copilot left $comments comment(s) on $head"
            exit 0
          fi

          # Fail closed: zero comments also fits "Copilot wasn't able to review".
          # Exactly one coverage line, in Copilot's own wording at the start of a
          # line, must name every file the PR changes. A summary that quotes the
          # sentence from the diff yields a second line and is rejected.
          coverage=$(gh api "repos/$REPO/pulls/$PR/reviews/$REVIEW_ID" --jq .body \
            | grep -E '^Copilot reviewed [0-9]+ out of [0-9]+ changed files in this pull request' || true)
          expected="Copilot reviewed $changed out of $changed changed files in this pull request"
          if [ "$(printf '%s\n' "$coverage" | grep -c .)" -ne 1 ] || [[ "$coverage" != "$expected"* ]]; then
            withdraw "Copilot's review does not confirm it covered all $changed changed files"
            exit 0
          fi

          # Pinned to the reviewed commit, so a push racing this job is not approved.
          gh api -X POST "repos/$REPO/pulls/$PR/reviews" -f commit_id="$REVIEW_SHA" -f event=APPROVE \
            -f body="Copilot code review found nothing to flag on $REVIEW_SHA." --silent
